name: My second github actions file
on:
  push:
    branches:
      - master
      
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code from repositroy
        uses: actions/checkout@v7
      - name: Install the node jobs
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: run the tests
        run: npm test
